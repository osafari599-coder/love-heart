<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #060208;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    background: #060208;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const SC = 21;
const OY = 20;
const DURATION = 10;
const TICK = 16;
const ANIM = 42;
const LIFT = 34;
const GAP = 7;
const SIZES = [9, 10, 11, 12];
const BG = '#060208';
const BGC = [6/255, 2/255, 8/255];
const FLASH = [1.0, 0.78, 0.78];

const PHRASES = [
  "I love you", "دوست دارم", "دوست دارم", "دوست دارم",
  "دوست دارم", "دوست دارم", "دوست دارم", "دوست دارم",
  "دوست دارم", "دوست دارم",
  "دوست دارم", "دوست دارم", "دوست دارم", "دوست دارم",
  "دوست دارم", "دوست دارم", "دوست دارم", "دوست دارم"
];

let W, H, CX, CY;
let active = [];
let mainItems = [];
let spawning = true;
let acc = 0;
let items = [];
let RATE = 0;
let rng = mulberry32(11);

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

function heart(a) {
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

const POLY = [];
for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % 720]]);
const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const HEART_CY = (YMAX + YMIN) / 2;

function spans(y) {
  const xs = [];
  for (const [[x1, y1], [x2, y2]] of EDGES) {
    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
      xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
    }
  }
  xs.sort((a, b) => a - b);
  const res = [];
  for (let i = 0; i < xs.length; i += 2) {
    if (i + 1 < xs.length) res.push([xs[i], xs[i + 1]]);
  }
  return res;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) {
    for (const b of B) {
      const lo = Math.max(a[0], b[0]);
      const hi = Math.min(a[1], b[1]);
      if (hi - lo > 14) out.push([lo, hi]);
    }
  }
  return out;
}

function phraseCycle() {
  let order = [...PHRASES];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  let idx = 0;
  return function() {
    if (idx >= order.length) {
      order = [...PHRASES];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      idx = 0;
    }
    return order[idx++];
  };
}

function measureText(text, size) {
  ctx.font = `bold ${size}px Arial`;
  return ctx.measureText(text).width;
}

function mathDist(x, y) {
  return Math.hypot(x / (16 * SC), (y - HEART_CY) / (14.5 * SC));
}

function mix(a, b, k) {
  return a.map((v, i) => v + (b[i] - v) * k);
}
function dim(c, k) {
  return c.map(v => v * k);
}
function hx(c) {
  return '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)
    .toString(16).padStart(2, '0')).join('');
}
function clamp(v) {
  return Math.max(0, Math.min(1, v));
}

function build() {
  const nextPhrase = phraseCycle();
  const rowH = 16;
  const half = rowH / 2;
  const placed = [];

  let y = YMAX - half;
  while (y > YMIN + half) {
    const row = intersect(spans(y + half), spans(y - half));
    for (let [lo, hi] of row) {
      lo += 4;
      hi -= 4;
      let cur = lo + rng() * 8;
      const line = [];

      while (true) {
        let fit = null;
        for (let t = 0; t < 12; t++) {
          const text = nextPhrase();
          const size = SIZES[Math.floor(rng() * SIZES.length)];
          const w = measureText(text, size);
          if (cur + w <= hi) {
            fit = { text, size, w };
            break;
          }
        }
        if (!fit) break;
        line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
        cur += fit.w + GAP;
      }

      if (line.length === 0) continue;

      if (line.length > 1) {
        const left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
        line.forEach((it, i) => {
          it.x += left * i / (line.length - 1);
        });
      } else {
        line[0].x = (lo + hi) / 2;
      }

      line.forEach((it, i) => {
        const edge = (i === 0 || i === line.length - 1);
        placed.push({
          x: it.x,
          y: y,
          text: it.text,
          size: it.size,
          edge,
          f: 0,
          dx: 0
        });
      });
    }
    y -= rowH;
  }

  const wine = [0.58, 0.0, 0.09];
  const crimson = [0.90, 0.05, 0.14];
  const blood = [0.98, 0.10, 0.16];

  for (const p of placed) {
    const rad = Math.min(1, mathDist(p.x, p.y));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, rng() * 0.35 + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
  }

  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);

  edges.sort((a, b) => {
    const aa = Math.atan2(a.x, a.y - HEART_CY);
    const bb = Math.atan2(b.x, b.y - HEART_CY);
    return aa - bb;
  });

  inner.sort((a, b) => (-a.rad + rng() * 0.08) - (-b.rad + rng() * 0.08));

  return edges.concat(inner);
}

function spawn(p) {
  p.f = 0;
  p.dx = (rng() - 0.5) * 20;
  active.push(p);
  mainItems.push(p);
}

function animate(p) {
  p.f++;
  const u = clamp(p.f / ANIM);
  const e = 1 - Math.pow(1 - u, 3);
  const c = p.color;

  const finalX = CX + p.x;
  const finalY = CY - p.y;

  const hover = (1 - e) * LIFT;
  const px = finalX + p.dx * (1 - e);
  const py = finalY - hover;

  // سایه
  ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
  ctx.font = `bold ${p.size}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.text, px + 2, py + 3);

  // هاله
  ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
  ctx.font = `bold ${p.size + 1}px Arial`;
  ctx.fillText(p.text, px, py);

  // متن اصلی با فلش
  const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
  const col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash);
  ctx.fillStyle = hx(col);
  ctx.font = `bold ${p.size}px Arial`;
  ctx.fillText(p.text, px, py);

  if (u >= 1) {
    p.finalX = finalX;
    p.finalY = finalY;
    return false;
  }
  return true;
}

function drawStatic() {
  for (const p of mainItems) {
    if (p.f < ANIM) continue;
    const c = p.color;
    const x = p.finalX;
    const y = p.finalY;

    ctx.fillStyle = hx(dim(c, 0.25));
    ctx.font = `bold ${p.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, x + 1.5, y + 2);

    ctx.fillStyle = hx(c);
    ctx.fillText(p.text, x, y);
  }
}

let lastShimmer = 0;
function shimmer(now) {
  if (now - lastShimmer < 140) return;
  lastShimmer = now;
  if (mainItems.length === 0) return;
  const p = mainItems[Math.floor(rng() * mainItems.length)];
  p.shimmerUntil = now + 260;
}

function step(now) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  if (spawning) {
    acc += RATE;
    while (acc >= 1 && items.length > 0) {
      acc -= 1;
      spawn(items.shift());
    }
    if (items.length === 0) spawning = false;
  }

  active = active.filter(p => animate(p));
  drawStatic();

  if (!spawning && active.length === 0) {
    shimmer(now);
  }

  // رسم shimmer
  for (const p of mainItems) {
    if (p.shimmerUntil && now < p.shimmerUntil) {
      const x = p.finalX;
      const y = p.finalY;
      const col = mix(p.color, FLASH, 0.6);
      ctx.fillStyle = hx(col);
      ctx.font = `bold ${p.size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, x, y);
    }
  }

  requestAnimationFrame(step);
}

// شروع
const placed = build();
items = [...placed];
RATE = placed.length / (DURATION * 1000 / TICK);
requestAnimationFrame(step);
</script>
</body>
</html>
